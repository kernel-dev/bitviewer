# Builds Bit Viewer for Windows, macOS and Linux and publishes a GitHub release.
#
# Trigger: push a tag that matches the version in Cargo.toml, e.g.
#   git tag v3.0.0 && git push origin v3.0.0
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the minisign key the
# 2.x app's updater already trusts; ~/.tauri/bitviewer.key). It signs the
# Windows installer that the in-app updater downloads. Add
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD only if the key has a password.
#
# What gets published:
#   Bit.Viewer_<v>_x64-setup.exe        Windows installer (also the in-app update)
#   Bit.Viewer_<v>_x64-portable.zip     Windows, no install
#   Bit.Viewer_<v>_aarch64.dmg / _x64.dmg   macOS (Apple Silicon / Intel)
#   bitviewer_<v>_linux_x64.tar.gz      Linux
#   latest.json                         the updater feed

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version and notes
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag Cargo.toml=$cargo"
          if [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag doesn't match the version in Cargo.toml ($cargo)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: CHANGELOG.md has notes for this version
        run: node scripts/changelog.mjs "${GITHUB_REF_NAME#v}"

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - name: Linux x64
            os: ubuntu-22.04 # older glibc, so the build runs on more distributions
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release -p bitviewer --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\NSIS"
          }
          $out = New-Item -ItemType Directory -Force release-files
          $exe = (Resolve-Path "target/${{ matrix.target }}/release/bitviewer.exe").Path
          makensis "/DVERSION=$v" "/DEXE=$exe" "/DOUT=$out\Bit.Viewer_${v}_x64-setup.exe" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portable = New-Item -ItemType Directory -Force portable
          Copy-Item $exe "$portable\BitViewer.exe"
          Copy-Item LICENSE "$portable\LICENSE.txt"
          Compress-Archive -Path "$portable\*" -DestinationPath "$out\Bit.Viewer_${v}_x64-portable.zip"

      - name: Sign the installer for the updater
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 signer sign release-files/*-setup.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p release-files
          app="Bit Viewer.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/bitviewer" "$app/Contents/MacOS/BitViewer"
          cp app/assets/app-icon/icon.icns "$app/Contents/Resources/icon.icns"
          sed "s/VERSION/$v/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          hdiutil create -volname "Bit Viewer" -srcfolder "$app" -ov -format UDZO "release-files/Bit.Viewer_${v}_${{ matrix.arch }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${GITHUB_REF_NAME#v}"
          dir="bitviewer-$v"
          mkdir -p release-files "$dir"
          cp "target/${{ matrix.target }}/release/bitviewer" "$dir/"
          cp packaging/linux/bitviewer.desktop "$dir/"
          cp app/assets/app-icon/128x128.png "$dir/bitviewer.png"
          cp LICENSE "$dir/"
          tar -czf "release-files/bitviewer_${v}_linux_x64.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-files/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      # The release notes (also shown by the in-app updater) are this version's
      # section of CHANGELOG.md.
      - name: Release notes and the updater feed
        run: |
          node scripts/changelog.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
          node scripts/latest-json.mjs "$GITHUB_REF_NAME" release-files > release-files/latest.json
          rm release-files/*.sig
          cat release-files/latest.json
          ls -l release-files

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "Bit Viewer ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
