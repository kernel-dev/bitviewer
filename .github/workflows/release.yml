# Builds Bit Viewer for Windows, macOS and Linux and publishes a GitHub release.
#
# Trigger: push a tag that matches the app version, e.g.
#   git tag v2.1.0 && git push origin v2.1.0
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the contents of
# ~/.tauri/bitviewer.key). It signs the update files the in-app updater checks.
# Add TAURI_SIGNING_PRIVATE_KEY_PASSWORD only if the key has a password.

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag doesn't match the version in tauri.conf.json, package.json and Cargo.toml"
            exit 1
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: CHANGELOG.md has notes for this version
        run: node scripts/changelog.mjs "${GITHUB_REF_NAME#v}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run build # creates dist/, which the Rust crate embeds
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  create-release:
    name: Create draft release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.result }}
      notes: ${{ steps.create.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The release notes (also shown by the in-app updater) are this version's
      # section of CHANGELOG.md.
      - name: Read the release notes from CHANGELOG.md
        run: node scripts/changelog.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const notes = require("fs").readFileSync("release-notes.md", "utf8").trim();
            core.setOutput("notes", notes);
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace("refs/tags/", ""),
              name: `Bit Viewer ${context.ref.replace("refs/tags/v", "")}`,
              body: notes,
              draft: true,
            });
            return data.id;

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04 # older glibc, so the build runs on more distributions
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # notes for latest.json, which the in-app updater shows
          releaseBody: ${{ needs.create-release.outputs.notes }}
          # also build the signed update files and latest.json for the in-app updater
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          updaterJsonPreferNsis: true

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number("${{ needs.create-release.outputs.id }}"),
              draft: false,
            });
