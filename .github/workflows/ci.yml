# Checks every push to main and every pull request: types, lint, unit tests,
# Rust formatting, clippy and Rust tests (npm run check), then the
# end-to-end tests in Playwright's Chromium.
#
# Releases are built by release.yml when a version tag is pushed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run build # creates dist/, which the Rust crate embeds
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
