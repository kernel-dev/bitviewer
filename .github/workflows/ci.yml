# Checks every push to main and every pull request on Windows, macOS and
# Linux: formatting, clippy (warnings fail the build) and every test (the
# core library's and the app's, which drive real windows on GPUI's test
# platform).
#
# Releases are built by release.yml when a version tag is pushed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
