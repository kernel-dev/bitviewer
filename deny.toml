# cargo deny check: licences, security advisories, duplicate crates and
# where crates come from. CI runs it (ci.yml, "Dependencies").

[graph]
all-features = false

[advisories]
# Security advisories always fail. Unmaintained crates fail only when the
# workspace depends on them directly; the ones deeper down (today all in the
# GPUI CE stack: its components, platform layer, SVG and font libraries and
# Linux accessibility) are GPUI CE's to replace; .cargo/audit.toml lists them.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Every licence in the tree is permissive (or offers a permissive choice),
# except MPL-2.0, a file-level copyleft that is fine to ship in a binary.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# our own crates (publish = false) are MIT, like the repository
ignore = true

[bans]
# GPUI CE's tree pulls several versions of windows-*, hashbrown, rand and
# font crates; none of them is a choice this workspace makes.
multiple-versions = "allow"
wildcards = "deny"
# path dependencies inside the workspace (bitviewer-core) have no version
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
