[package]
name = "bitviewer"
description = "Bit Viewer: the GPUI user interface"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "bitviewer"
path = "src/main.rs"

[dependencies]
rayon = "1"
# regular expressions in search (linear time: no pattern can hang the app)
regex = "1"
bitviewer-core = { path = "../core" }
# GPUI CE (the community edition of GPUI) with its GPUI Component library
# (inputs, menus, dialogs, notifications, themes); see src/kit.rs
gpui = { package = "gpui-ce", version = "0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "0.1" }
gpui-component = { package = "gpui_ce_components", version = "0.2" }
gpui-component-assets = { package = "gpui_ce_components_assets", version = "0.2" }
num-bigint = "0.5"
num-traits = "0.2"
serde_json = "1"
futures = "0.3"
rust-embed = "8"
# updates: the release feed over HTTPS, and its minisign signatures
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
minisign-verify = "0.2"
base64 = "0.22"
# interface sounds: tones synthesized at run time (no audio files)
rodio = { version = "0.19", default-features = false }
# local time for snapshot dates
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# the Windows exe's icon and version details (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# GPUI's test platform: windows with simulated input, for the interface tests
gpui = { package = "gpui-ce", version = "0.2.2", features = ["test-support"] }
